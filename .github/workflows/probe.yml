name: probe

on:
  workflow_dispatch:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/probe.yml"
  schedule:
    # 04:30 UTC = 10:00 IST, 09:30 UTC = 15:00 IST, 17:00 UTC = 22:30 IST
    - cron: "30 4 * * *"
    - cron: "30 9 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: probe
    steps:
      - name: Check secrets are configured
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet; skipping (see docs/setup-guide.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Deploy probe Worker
        if: steps.guard.outputs.ready == 'true'
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Call probe (from Cloudflare's network) and print result
        if: steps.guard.outputs.ready == 'true'
        run: |
          sleep 10
          echo "=== PROBE RESULT $(date -u +%FT%TZ) ==="
          curl -s --max-time 60 "${{ steps.deploy.outputs.url }}" | tee result.json
          echo
          echo "=== END PROBE RESULT ==="

      - name: Remove probe Worker
        if: always() && steps.guard.outputs.ready == 'true'
        run: npx wrangler delete --force || true

  # Direct test from the GitHub runner itself (not via Cloudflare): NSE quote-equity (sector classification, D8).
  quote-equity-from-github:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: quote-equity for one stock (INFY), cookie flow
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          J=cookies.txt
          echo "homepage: $(curl -s -o /dev/null -w '%{http_code}' -c $J -A "$UA" -H 'Accept: text/html' -H 'Accept-Language: en-US,en;q=0.9' https://www.nseindia.com/)"
          sleep 2
          echo "quote page: $(curl -s -o /dev/null -w '%{http_code}' -b $J -c $J -A "$UA" -H 'Accept: text/html' 'https://www.nseindia.com/get-quotes/equity?symbol=INFY')"
          sleep 2
          code=$(curl -s -o q.json -w '%{http_code}' -b $J -A "$UA" -H 'Accept: application/json' -H 'Referer: https://www.nseindia.com/get-quotes/equity?symbol=INFY' 'https://www.nseindia.com/api/quote-equity?symbol=INFY')
          echo "quote-equity status: $code ($(wc -c < q.json) bytes)"
          echo "=== QUOTE-EQUITY RESULT ==="
          python3 -c "import json;d=json.load(open('q.json'));print(json.dumps({'symbol':d.get('info',{}).get('symbol'),'industryInfo':d.get('industryInfo'),'issuedSize':d.get('securityInfo',{}).get('issuedSize')},indent=1))" 2>/dev/null || head -c 400 q.json
          echo "=== END QUOTE-EQUITY RESULT ==="


  # Replication test (owner OK, log #230): the method recorded in PLAN Appendix B (#228).
  # Python httpx over HTTP/1.1 with JSON Accept + root Referer; curl --http1.1 with the same headers as a control.
  quote-equity-httpx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q httpx
      - name: Runner location
        run: curl -s --max-time 10 https://ipinfo.io/json | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('ip'),d.get('city'),d.get('country'),d.get('org'))" || true
      - name: quote-equity via httpx (HTTP/1.1)
        shell: python
        run: |
          import json, random, time, httpx
          site = "https://www.nseindia.com"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": site + "/",
          }
          print("=== QUOTE-EQUITY HTTPX RESULT ===")
          with httpx.Client(headers=headers, follow_redirects=True, timeout=30) as c:
              try:
                  r = c.get(site + "/", headers={"Accept": "text/html,application/xhtml+xml,*/*;q=0.8"})
                  print("homepage:", r.status_code, r.http_version, "cookies:", sorted(c.cookies.keys()))
              except httpx.HTTPError as e:
                  print("homepage error:", e)
              for sym in ("ITC", "INFY"):
                  time.sleep(random.uniform(3, 5))
                  try:
                      r = c.get(site + "/api/quote-equity", params={"symbol": sym})
                  except httpx.HTTPError as e:
                      print(sym, "error:", e); continue
                  line = f"{sym}: {r.status_code} {r.http_version} {len(r.content)} bytes"
                  try:
                      print(line, json.dumps(r.json().get("industryInfo")))
                  except Exception:
                      print(line, r.text[:150].replace("\n", " "))
          print("=== END ===")
      - name: Control - curl HTTP/1.1, same headers
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          echo "homepage: $(curl --http1.1 -s -o /dev/null -w '%{http_code}' -c j.txt -A "$UA" -H 'Accept: text/html' https://www.nseindia.com/)"
          sleep 4
          echo "quote-equity ITC: $(curl --http1.1 -s -o q.json -w '%{http_code}' -b j.txt -A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Accept-Language: en-US,en;q=0.9' -H 'Referer: https://www.nseindia.com/' 'https://www.nseindia.com/api/quote-equity?symbol=ITC') ($(wc -c < q.json) bytes)"
