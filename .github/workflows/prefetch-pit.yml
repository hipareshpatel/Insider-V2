name: prefetch-pit

# C53 / owner #330: NSE insider-trading filings (system from 3 May 2026) downloaded on GitHub and passed to Cloudflare
# as one bundle per run (bundles/pit_gg/<from>_<to>.jsonl.gz); the filings Worker loads it. Daily: the last 3 days.
# 4 Nov 2026: NSE refuses GitHub's runners for the API host (every list call: connection refused), so the daily list
# is fetched by the Cloudflare prefetch (daily slot) and the XBRL files by the attachment job. Manual runs only.
on:
  workflow_dispatch:
    inputs:
      from: { description: "from date YYYY-MM-DD (blank = 3 days ago, IST)", default: "" }
      to: { description: "to date YYYY-MM-DD (blank = today, IST)", default: "" }

permissions:
  contents: read

concurrency:
  group: prefetch-pit
  cancel-in-progress: false

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Download and bundle
        run: |
          set -o pipefail
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email hidden>/g'; }
          TO="${{ github.event.inputs.to }}"; [ -z "$TO" ] && TO=$(TZ=Asia/Kolkata date +%F)
          FROM="${{ github.event.inputs.from }}"; [ -z "$FROM" ] && FROM=$(TZ=Asia/Kolkata date -d "$TO -3 days" +%F)
          python3 tools/prefetch_pit_gg.py disclo-raw "$FROM" "$TO" 2>&1 | mask
