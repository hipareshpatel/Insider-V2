name: infra-check

# Read-only: what can the CLOUDFLARE_API_TOKEN see/create? Lists D1, R2, Queues; changes nothing.
# Logs of a public repo are public: every step pipes through `mask` (hides email addresses and account names).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"   # daily 19:47 IST: cost guard (D137); a failed run emails the owner

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Install mask filter
        run: |
          printf '%s\n' '#!/bin/sh' "sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/<email hidden>/g; s/│ [^│]*Account[^│]*│/│ <account hidden> │/g'" > "$HOME/mask" && chmod +x "$HOME/mask" && mkdir -p "$HOME/bin" && mv "$HOME/mask" "$HOME/bin/mask" && echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Token
        run: wrangler whoami 2>&1 | mask || true
      - name: D1
        run: wrangler d1 list 2>&1 | mask | tail -20 || true
      - name: R2
        run: wrangler r2 bucket list 2>&1 | mask | tail -20 || true
      - name: Queues
        run: wrangler queues list 2>&1 | mask | tail -20 || true
      - name: Sizes (D1 databases, R2 buckets)
        run: |
          for db in disclo-market disclo-filings disclo-app disclo-announce disclo-memory disclo-graph disclo-market-staging disclo-app-staging; do
            echo "== $db"; wrangler d1 info $db 2>&1 | mask | grep -iE "size|rows|tables" || true
          done
          for b in disclo-raw disclo-raw-staging; do echo "== $b"; wrangler r2 bucket info $b 2>&1 | mask | grep -iE "size|object|count" || true; done
      - name: D1 billed usage this month (owner #266 cap; numbers only)
        run: |
          FROM=$(TZ=Asia/Kolkata date +%Y-%m-01)
          python3 - "$FROM" <<'PY' | mask
          import json, os, sys, urllib.request
          q = {"query": "query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{date_geq:$f}){sum{rowsWritten rowsRead}dimensions{databaseId date}}}}}",
               "variables": {"a": os.environ["CLOUDFLARE_ACCOUNT_ID"], "f": sys.argv[1]}}
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=json.dumps(q).encode(), headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json", "User-Agent": "disclo-infra-check/1"})
          d = json.load(urllib.request.urlopen(req, timeout=60))
          if d.get("errors"): print("graphql errors:", [e.get("message") for e in d["errors"]]); sys.exit(0)
          g = d["data"]["viewer"]["accounts"][0]["d1AnalyticsAdaptiveGroups"]
          by_day, rd_day = {}, {}
          for r in g:
              by_day[r["dimensions"]["date"]] = by_day.get(r["dimensions"]["date"], 0) + r["sum"]["rowsWritten"]
              rd_day[r["dimensions"]["date"]] = rd_day.get(r["dimensions"]["date"], 0) + r["sum"]["rowsRead"]
          # C18 re-measure: rows read per day next to rows written (reads are the larger bill line)
          for k in sorted(by_day): print(k, "written", by_day[k], "read", rd_day[k])
          print("MONTH_ROWS_WRITTEN", sum(by_day.values()), "rows_read", sum(r["sum"]["rowsRead"] for r in g))
          # Workers CPU time this period (included 30M ms; owner #269)
          q2 = {"query": "query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:1000,filter:{date_geq:$f}){sum{requests}quantiles{cpuTimeP50}dimensions{scriptName date}}}}}", "variables": q["variables"]}
          try:
              d2 = json.load(urllib.request.urlopen(urllib.request.Request(req.full_url, data=json.dumps(q2).encode(), headers=dict(req.header_items())), timeout=60))
              rows = (d2.get("data") or {}).get("viewer", {}).get("accounts", [{}])[0].get("workersInvocationsAdaptive", []) if not d2.get("errors") else []
              by = {}
              for r in rows: by[r["dimensions"]["scriptName"]] = by.get(r["dimensions"]["scriptName"], 0) + r["sum"]["requests"]
              print("WORKER_REQUESTS", by if by else d2.get("errors"))
          except Exception as e: print("workers analytics:", str(e)[:120])
          PY
      - name: Cost guard (D137 - fail above $4 estimated usage charges this period)
        run: |
          python3 - <<'PY' | mask
          import datetime as dt, json, os, sys, urllib.request
          today = dt.datetime.utcnow().date()
          start = today.replace(day=2) if today.day >= 2 else (today.replace(day=1) - dt.timedelta(days=1)).replace(day=2)  # billing period starts on the 2nd (#267)
          def gql(query):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=json.dumps({"query": query, "variables": {"a": os.environ["CLOUDFLARE_ACCOUNT_ID"], "f": str(start)}}).encode(),
                                           headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json", "User-Agent": "disclo-infra-check/1"})
              d = json.load(urllib.request.urlopen(req, timeout=60))
              if d.get("errors"): print("graphql:", [e.get("message") for e in d["errors"]]); return None
              return d["data"]["viewer"]["accounts"][0]
          d1 = gql("query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{date_geq:$f}){sum{rowsWritten rowsRead}}}}}")
          r2 = gql("query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){r2OperationsAdaptiveGroups(limit:1000,filter:{date_geq:$f}){sum{requests}dimensions{actionType}}}}}")
          st = gql("query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){r2StorageAdaptiveGroups(limit:100,filter:{date_geq:$f}){max{payloadSize}dimensions{bucketName}}}}}")
          w = sum(x["sum"]["rowsWritten"] for x in d1["d1AnalyticsAdaptiveGroups"]) if d1 else 0
          rd = sum(x["sum"]["rowsRead"] for x in d1["d1AnalyticsAdaptiveGroups"]) if d1 else 0
          B = {"GetObject", "HeadObject", "UsageSummary", "GetBucketEncryption", "GetBucketLocation", "GetBucketCors", "GetBucketLifecycleConfiguration"}
          a = b = 0
          for x in (r2 or {}).get("r2OperationsAdaptiveGroups", []):
              t = x["dimensions"]["actionType"]
              if t in B: b += x["sum"]["requests"]
              elif t not in ("DeleteObject", "AbortMultipartUpload"): a += x["sum"]["requests"]
          sizes = {}
          for x in (st or {}).get("r2StorageAdaptiveGroups", []): sizes[x["dimensions"]["bucketName"]] = max(sizes.get(x["dimensions"]["bucketName"], 0), x["max"]["payloadSize"])
          gb = sum(sizes.values()) / 1e9
          cost = {"d1_writes": max(0, w - 50e6) / 1e6 * 1.0, "d1_reads": max(0, rd - 25e9) / 1e6 * 0.001,
                  "r2_class_a": max(0, a - 1e6) / 1e6 * 4.5, "r2_class_b": max(0, b - 10e6) / 1e6 * 0.36, "r2_storage": max(0, gb - 10) * 0.015}
          total = sum(cost.values())
          print(f"period from {start}: d1 written {w:,} read {rd:,}; r2 class A {a:,} class B {b:,}; r2 stored {gb:.2f} GB")
          print("estimated usage charges ($):", {k: round(v, 2) for k, v in cost.items()}, "total", round(total, 2), "(Workers CPU from the dashboard: $0.02 per extra million ms)")
          limit = 20 if str(start) == "2026-11-02" else 4  # D166: $25 ceiling for the Nov 2026 billing period only; $10 (usage $4 alarm) again after
          if total > limit: print(f"::error::estimated usage charges above ${limit} this period (D137, D166)"); sys.exit(1)
          PY
      - name: Top D1 queries by rows read this period (owner #271)
        run: |
          wrangler d1 list --json 2>/dev/null > /tmp/dbs.json || echo "[]" > /tmp/dbs.json
          python3 - <<'PY' | mask
          import datetime as dt, json, os, urllib.request
          today = dt.date.today(); start = today.replace(day=2) if today.day >= 2 else (today.replace(day=1) - dt.timedelta(days=1)).replace(day=2)
          names = {d.get("uuid"): d.get("name") for d in json.load(open("/tmp/dbs.json"))} if os.path.getsize("/tmp/dbs.json") else {}
          q = {"query": "query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:30,filter:{date_geq:$f},orderBy:[sum_rowsRead_DESC]){count sum{rowsRead rowsWritten queryDurationMs}dimensions{query databaseId}}}}}",
               "variables": {"a": os.environ["CLOUDFLARE_ACCOUNT_ID"], "f": str(start)}}
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=json.dumps(q).encode(), headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json", "User-Agent": "disclo-infra-check/1"})
          d = json.load(urllib.request.urlopen(req, timeout=60))
          if d.get("errors"): print("graphql:", [e.get("message") for e in d["errors"]])
          else:
              for r in d["data"]["viewer"]["accounts"][0]["d1QueriesAdaptiveGroups"]:
                  s = r["sum"]; print(f'{s["rowsRead"]:>14,} read {s["rowsWritten"]:>11,} written {r["count"]:>8,}x  {names.get(r["dimensions"]["databaseId"], "?"):<22} {" ".join(r["dimensions"]["query"].split())[:260]}')
          PY
