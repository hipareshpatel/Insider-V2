name: infra-check

# Read-only: what can the CLOUDFLARE_API_TOKEN see/create? Lists D1, R2, Queues; changes nothing.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/infra-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Token
        run: wrangler whoami 2>&1 | grep -v -i "email" || true
      - name: D1
        run: wrangler d1 list 2>&1 | tail -20 || true
      - name: R2
        run: wrangler r2 bucket list 2>&1 | tail -20 || true
      - name: Queues
        run: wrangler queues list 2>&1 | tail -20 || true
