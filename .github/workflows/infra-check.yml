name: infra-check

# Read-only: what can the CLOUDFLARE_API_TOKEN see/create? Lists D1, R2, Queues; changes nothing.
# Logs of a public repo are public: every step pipes through `mask` (hides email addresses and account names).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Install mask filter
        run: |
          printf '%s\n' '#!/bin/sh' "sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/<email hidden>/g; s/│ [^│]*Account[^│]*│/│ <account hidden> │/g'" > "$HOME/mask" && chmod +x "$HOME/mask" && mkdir -p "$HOME/bin" && mv "$HOME/mask" "$HOME/bin/mask" && echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Token
        run: wrangler whoami 2>&1 | mask || true
      - name: D1
        run: wrangler d1 list 2>&1 | mask | tail -20 || true
      - name: R2
        run: wrangler r2 bucket list 2>&1 | mask | tail -20 || true
      - name: Queues
        run: wrangler queues list 2>&1 | mask | tail -20 || true
      - name: Sizes (D1 databases, R2 buckets)
        run: |
          for db in disclo-market disclo-filings disclo-app disclo-announce disclo-memory disclo-graph disclo-market-staging disclo-app-staging; do
            echo "== $db"; wrangler d1 info $db 2>&1 | mask | grep -iE "size|rows|tables" || true
          done
          for b in disclo-raw disclo-raw-staging; do echo "== $b"; wrangler r2 bucket info $b 2>&1 | mask | grep -iE "size|object|count" || true; done
      - name: D1 billed usage this month (owner #266 cap; numbers only)
        run: |
          FROM=$(TZ=Asia/Kolkata date +%Y-%m-01)
          python3 - "$FROM" <<'PY' | mask
          import json, os, sys, urllib.request
          q = {"query": "query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{date_geq:$f}){sum{rowsWritten rowsRead}dimensions{databaseId date}}}}}",
               "variables": {"a": os.environ["CLOUDFLARE_ACCOUNT_ID"], "f": sys.argv[1]}}
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=json.dumps(q).encode(), headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json", "User-Agent": "disclo-infra-check/1"})
          d = json.load(urllib.request.urlopen(req, timeout=60))
          if d.get("errors"): print("graphql errors:", [e.get("message") for e in d["errors"]]); sys.exit(0)
          g = d["data"]["viewer"]["accounts"][0]["d1AnalyticsAdaptiveGroups"]
          by_day = {}
          for r in g: by_day[r["dimensions"]["date"]] = by_day.get(r["dimensions"]["date"], 0) + r["sum"]["rowsWritten"]
          for k in sorted(by_day): print(k, by_day[k])
          print("MONTH_ROWS_WRITTEN", sum(by_day.values()), "rows_read", sum(r["sum"]["rowsRead"] for r in g))
          # Workers CPU time this period (included 30M ms; owner #269)
          q2 = {"query": "query($a:String!,$f:Date!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:1000,filter:{date_geq:$f}){sum{requests}quantiles{cpuTimeP50}dimensions{scriptName date}}}}}", "variables": q["variables"]}
          try:
              d2 = json.load(urllib.request.urlopen(urllib.request.Request(req.full_url, data=json.dumps(q2).encode(), headers=dict(req.header_items())), timeout=60))
              rows = (d2.get("data") or {}).get("viewer", {}).get("accounts", [{}])[0].get("workersInvocationsAdaptive", []) if not d2.get("errors") else []
              by = {}
              for r in rows: by[r["dimensions"]["scriptName"]] = by.get(r["dimensions"]["scriptName"], 0) + r["sum"]["requests"]
              print("WORKER_REQUESTS", by if by else d2.get("errors"))
          except Exception as e: print("workers analytics:", str(e)[:120])
          PY
