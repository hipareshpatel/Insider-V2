name: ops

# Audit P1 (owner #341): the only way to read a diagnostic page or run a one-off pass. No standing secret: each run sets a
# fresh random STATUS_TOKEN on the target Worker, calls it, and prints the answer (masked) in this log.
#  - status pages: GET once (never in a loop, C56), e.g. worker=filings path=/status
#  - one-off passes (D163): POST /maint/<name>, repeated until the pass answers done or `minutes` run out; each call is one
#    bounded batch that saves its position. Names — filings: bscf_backfill, version_backfill, remark_backfill;
#    prefetch: compress, full_history, structure_history; market: deals_refill, index_history, index_weekends,
#    derive_jan2024, repair_factors.
on:
  workflow_dispatch:
    inputs:
      worker: { description: "worker", type: choice, options: [filings, prefetch, market], default: filings }
      path: { description: "path, e.g. /status or /maint/version_backfill", default: "/status" }
      minutes: { description: "for /maint: keep calling until done, at most this many minutes", default: "10" }
      max_calls: { description: "for /maint: at most this many calls (1 = one batch, e.g. the first-batch cost gate)", default: "1000" }

permissions:
  contents: read

concurrency:
  group: ops-${{ github.event.inputs.worker }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ github.event.inputs.worker }}
      PATH_IN: ${{ github.event.inputs.path }}
      MINUTES: ${{ github.event.inputs.minutes }}
      MAX_CALLS: ${{ github.event.inputs.max_calls }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Call
        run: |
          set -o pipefail
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email hidden>/g; s/│ [^│]*Account[^│]*│/│ <account hidden> │/g'; }
          echo "$PATH_IN" | grep -Eq '^/[A-Za-z0-9/_?=&.,-]*$' || { echo "bad path"; exit 1; }
          case "$WORKER" in filings|prefetch|market) ;; *) echo "bad worker"; exit 1;; esac
          T=$(openssl rand -hex 32); echo "::add-mask::$T"
          printf '%s' "$T" | wrangler secret put STATUS_TOKEN --name "disclo-$WORKER" 2>&1 | mask | grep -E "Success|ERROR|✘" || true
          sleep 20
          URL="https://disclo-$WORKER.financialengineer-in.workers.dev$PATH_IN"
          case "$PATH_IN" in
            /maint/*)
              end=$(( $(date +%s) + ${MINUTES:-10} * 60 )); n=0
              # at least one call; then until the pass answers done, the time is up or MAX_CALLS calls were made
              while [ "$n" -eq 0 ] || { [ "$(date +%s)" -lt "$end" ] && [ "$n" -lt "${MAX_CALLS:-1000}" ]; }; do
                n=$((n+1))
                out=$(curl -s -X POST -H "Authorization: Bearer $T" "$URL" || true)
                # restart=1 applies to the first call only (5 Nov: sent on every call it reset the cursor each time,
                # 57 calls re-did the same 25 companies, about 7.2M rows read for nothing)
                URL=$(printf '%s' "$URL" | sed -E 's/([?&])restart=1(&|$)/\1restart=0\2/')
                echo "$(date -u +%H:%M:%S) $out" | cut -c1-20000 | mask  # was 1,500 (cut the half-year pass notes)
                echo "$out" | grep -q '"done":true' && break
                echo "$out" | grep -q '^forbidden\|unknown pass\|not found\|"refused"' && exit 1
                sleep 5
              done ;;
            # read-only pages: the whole answer is fetched, then at most 500 kB is printed (was 20 kB, which cut the
            # COFORGE results-list answer and failed the run with exit 23); a longer answer says so instead of failing
            *) curl -s -H "Authorization: Bearer $T" "$URL" -o /tmp/answer || true
               head -c 500000 /tmp/answer | mask; echo
               n=$(wc -c < /tmp/answer); [ "$n" -gt 500000 ] && echo "[answer is $n bytes; printed the first 500000]" || true ;;
          esac
