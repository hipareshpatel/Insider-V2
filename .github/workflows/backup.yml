name: backup

# D44: weekly export of every production D1 database to R2, 12 weeks kept (rotating slots: week number mod 12, so the
# slot from 12 weeks ago is overwritten — no delete step needed). D1 Time Travel (30 days) covers the days between.
# Logs of a public repo are public: output goes through `mask`; no data is printed.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 21 * * 6"   # Sunday 03:11 IST

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Export, compress, upload
        run: |
          set -o pipefail
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email hidden>/g'; }
          WEEK=$(date -u +%V); SLOT=$(printf "%02d" $(( 10#$WEEK % 12 ))); DAY=$(date -u +%Y-%m-%d)
          echo "slot $SLOT ($DAY)"
          fail=0
          for db in disclo-market disclo-filings disclo-app disclo-announce disclo-memory disclo-graph; do
            if wrangler d1 export "$db" --remote --output "$db.sql" 2>&1 | mask | tail -2; then
              gzip -9 "$db.sql"
              size=$(stat -c %s "$db.sql.gz")
              wrangler r2 object put "disclo-raw/backups/slot-$SLOT/$db.sql.gz" --file "$db.sql.gz" --remote 2>&1 | mask | tail -1 || fail=1
              printf '{"db":"%s","date":"%s","bytes":%s}\n' "$db" "$DAY" "$size" > "$db.json"
              wrangler r2 object put "disclo-raw/backups/slot-$SLOT/$db.json" --file "$db.json" --remote 2>&1 | mask | tail -1 || fail=1
              echo "$db: $size bytes (gzip) → backups/slot-$SLOT/"
              rm -f "$db.sql.gz"
            else
              echo "$db: export FAILED"; fail=1
            fi
          done
          exit $fail
