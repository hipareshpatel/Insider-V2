name: prefetch-archive

# D128: NSE archive history -> R2 (cache/ keys). The market Worker reads R2 first.
# No push trigger (owner #265/#278): editing the script must not re-download the whole history.
on:
  schedule:
    - cron: "37 13 * * 1-5"   # 19:07 IST weekdays: today's market + structure files + bulk/block snapshots (D144)
    - cron: "37 17 * * 1-5"   # 23:07 IST retry (V1 lesson #280: a missed bulk/block snapshot is lost for good)
  workflow_dispatch:
    inputs:
      from: { description: "from date (blank = today IST)", default: "" }
      to: { description: "to date (blank = today IST)", default: "" }
      set: { description: "market | structure | snapshot | indices | daily (market+structure+snapshot, today)", default: "daily" }

permissions:
  contents: read

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g wrangler@4.156.1 >/dev/null 2>&1
      - name: Reachability (one file)
        run: |
          curl -s -o /dev/null -w "archive from GitHub runner %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0" https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20240102_F_0000.csv.zip
      - name: Prefetch
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          TO="${{ github.event.inputs.to }}"; [ -z "$TO" ] && TO=$TODAY
          FROM="${{ github.event.inputs.from }}"; [ -z "$FROM" ] && FROM=$TO
          SET="${{ github.event.inputs.set }}"; [ -z "$SET" ] && SET=daily
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email hidden>/g'; }
          # the 23:07 run is a retry: only files the 19:07 run did not store (audit P1)
          if [ "${{ github.event.schedule }}" = "37 17 * * 1-5" ]; then export ONLY_MISSING=1; fi
          if [ "$SET" = "daily" ]; then
            for s in market structure snapshot; do python3 tools/prefetch_archive.py disclo-raw "$TODAY" "$TODAY" $s 2>&1 | mask; done
          else
            python3 tools/prefetch_archive.py disclo-raw "$FROM" "$TO" "$SET" 2>&1 | mask
          fi
